<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container1">
           <p>Site Collaboratif</p>
        </div>
        <div class="container2">
           <button class="btn">Se connecter</button>
           <button class=" btn btn1">S'inscrire</button>
        </div>
    </header>
    <main>
        <section class="hero2">
            <h1>Contactez-nous</h1>
        </section>
        <section class="formulaire">
            <form action="">
                <label for="text" >Nom</label>
                <input type="text" name="nom" placeholder="Saint" size="30" maxlength="20">
            </form>
            <form action="">
                <label for="text" >Postnom</label>
                <input type="text" name="postnom" placeholder="Jean" size="30" maxlength="20">
            </form>
            <form action="">
                <label for="text" >Prenom</label>
                <input type="text" name="prenom" placeholder="Marc" size="30" maxlength="20">
            </form>
            <form action="">
                <label for="email" >Email</label>
                <input type="email" name="email" placeholder="ex:marc@gmail,com" size="30" maxlength="20">
            </form>
            <form action="">
                <label for="messsage" >Message</label>
                <textarea name="message" id="message"></textarea>
            </form>
            <button class="btn btn2">Envoyer</button>
        </section>
    </main>
    <footer>
        <div><img src="facebook-fill-svgrepo-com (1).svg" alt=""></div>
        <div><img src="messenger-fill-svgrepo-com.svg" alt=""></div>
        <div><img src="telegram-fill-svgrepo-com.svg" alt=""></div>
        <div><img src="tiktok-fill-svgrepo-com.svg" alt=""></div>
        <div><img src="viber-fill-svgrepo-com.svg" alt=""></div>
    </footer>
</body>
</html>
